name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_DB: engageops
      POSTGRES_USER: engageops
      POSTGRES_PASSWORD: ci-only

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EngageOps.slnx

      - name: Verify formatting
        run: >
          dotnet format EngageOps.slnx
          --verify-no-changes
          --no-restore

      - name: Build
        run: >
          dotnet build EngageOps.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          --solution EngageOps.slnx
          --configuration Release
          --no-build

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build backend frontend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          package-json-file: src/frontend/package.json
          cache: true
          cache-dependency-path: src/frontend/pnpm-lock.yaml
          install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
