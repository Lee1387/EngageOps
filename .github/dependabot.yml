version: 2

# Frontend upgrades are deliberate; dependency-audit.yml monitors pnpm vulnerabilities.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
